<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>CandleStack App</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&display=swap">
<style>
  /* The page is the app itself, the Workspace dashboard. Colors and controls: the builder artifact's. */
  :root {
    --bg: #fafaf9; --ink: #141414; --muted: #686868; --rule: #e7e5e2; --accent: #0f766e;
    --warn: #a15c07; --down: #b42318; --up: #1a7f37; --candle-up: #2e9e44; --candle-down: #f23645;
    --grid: rgb(28 25 23 / 0.09); --shadow: rgb(0 0 0 / 0.08); --on-accent: #fafaf9; --tile: #ffffff; --tile-ink: #141414;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0d0f11; --ink: #ecedee; --muted: #9ba1a6; --rule: #23272b; --accent: #3cc7a6;
      --warn: #e8b45a; --down: #f0616d; --up: #43b049; --candle-up: #43b049; --candle-down: #f23645;
      --grid: rgb(230 232 234 / 0.075); --shadow: rgb(0 0 0 / 0.5); --on-accent: #0d0f11; --tile: #ffffff;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0d0f11; --ink: #ecedee; --muted: #9ba1a6; --rule: #23272b; --accent: #3cc7a6;
    --warn: #e8b45a; --down: #f0616d; --up: #43b049; --candle-up: #43b049; --candle-down: #f23645;
    --grid: rgb(230 232 234 / 0.075); --shadow: rgb(0 0 0 / 0.5); --on-accent: #0d0f11; --tile: #ffffff;
    color-scheme: dark;
  }
  :root {
    --surface: color-mix(in srgb, var(--ink) 5%, var(--bg));
    --surface2: color-mix(in srgb, var(--ink) 9%, var(--bg));
    --accent-soft: color-mix(in srgb, var(--accent) 12%, var(--bg));
    --sans: 'Geist', ui-sans-serif, system-ui, sans-serif;
    --mono: 'Geist Mono', ui-monospace, monospace;
  }

  *, *::before, *::after { box-sizing: border-box; }
  body {
    background: var(--surface); color: var(--ink); font-family: var(--sans); font-size: 14px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 0 56px;
  }
  button, input { font: inherit; color: inherit; }
  :focus-visible { outline: 2px solid color-mix(in srgb, var(--accent) 55%, transparent); outline-offset: 2px; }
  h1, h2, h3, p { margin: 0; }
  h1, h2, h3 { text-wrap: balance; }
  .mono { font-family: var(--mono); }
  .muted { color: var(--muted); }
  .up { color: var(--up); } .down { color: var(--down); }
  .eyebrow { font: 500 11px/16px var(--mono); letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); }
  .wrap { max-width: 1360px; margin: 0 auto; }

  /* The app frame */
  .frame {
    border: 1px solid var(--rule); border-radius: 12px; overflow: hidden; box-shadow: 0 1px 3px var(--shadow);
    background-color: var(--bg);
    background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size: 40px 40px;
  }
  .ahdr { display: flex; align-items: center; gap: 20px; height: 56px; padding: 0 20px; border-bottom: 1px solid var(--rule); background: color-mix(in srgb, var(--bg) 88%, transparent); }
  .home-link { appearance: none; border: 0; background: none; padding: 0; line-height: 0; border-radius: 6px; flex: none; }
  .logo { height: 28px; width: 152px; display: block; }
  .lg-a { fill: var(--accent); } .lg-b { fill: var(--bg); } .lg-c { fill: var(--ink); }
  .anav { display: flex; gap: 18px; font-size: 14px; }
  .anav span { color: var(--muted); } .anav span.on { color: var(--ink); font-weight: 500; }
  .ahdr .sp { flex: 1; }
  .ahdr .r { display: flex; align-items: center; gap: 8px; }
  .avatar { width: 30px; height: 30px; border-radius: 999px; background: var(--accent-soft); color: var(--accent); display: grid; place-items: center; font: 600 12px var(--mono); }
  .abody { max-width: 1200px; margin: 0 auto; padding: 28px 24px 40px; }
  .afoot { border-top: 1px solid var(--rule); background: var(--bg); }
  .afoot div { max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; flex-wrap: wrap; gap: 4px 20px; font-size: 12px; color: var(--muted); }

  .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: 34px; padding: 0 14px; border-radius: 6px; border: 1px solid var(--rule); background: var(--bg); color: var(--ink); font: 500 14px var(--sans); cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--surface); }
  .btn:disabled { opacity: 0.45; cursor: default; }
  .btn.pri { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
  .btn.pri:hover { background: color-mix(in srgb, var(--accent) 86%, var(--ink)); }
  .btn.ghost { border-color: transparent; background: transparent; }
  .btn.ghost:hover { background: var(--surface); }
  .btn.sm { height: 28px; padding: 0 10px; font-size: 13px; }
  .btn.lg { height: 42px; padding: 0 20px; font-size: 15px; }
  .icon { width: 34px; padding: 0; }
  .i { width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .card { background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; }
  .stack { display: flex; flex-direction: column; gap: 18px; }
  .ttl { display: flex; align-items: end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 20px; }
  .ttl h1 { font-size: 30px; line-height: 36px; font-weight: 600; letter-spacing: -0.025em; }
  .ttl p { color: var(--muted); margin-top: 4px; }

  /* Controls */
  .f { display: flex; flex-direction: column; gap: 8px; }
  .lab-row { display: flex; justify-content: space-between; align-items: baseline; }
  .seg { display: inline-flex; flex-wrap: wrap; gap: 4px; }
  .seg button { appearance: none; border: 1px solid var(--rule); background: var(--bg); height: 30px; min-width: 40px; padding: 0 10px; border-radius: 6px; font: 500 13px var(--mono); color: var(--muted); cursor: pointer; }
  .seg button:hover { color: var(--ink); }
  .seg button.on { color: var(--accent); border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .inp { height: 34px; border: 1px solid var(--rule); border-radius: 6px; padding: 0 10px; background: var(--bg); font: 14px var(--mono); color: var(--ink); width: 100%; min-width: 0; }
  .row2 { display: flex; align-items: center; gap: 8px; }
  input[type="range"] { width: 100%; accent-color: var(--accent); }
  .pick { display: flex; align-items: center; gap: 12px; border: 1px solid var(--rule); border-radius: 8px; padding: 10px 12px; background: var(--bg); }
  .pick-t { display: flex; flex-direction: column; min-width: 0; flex: 1; }
  .pick-t span { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .tile { width: 40px; height: 40px; flex: none; border-radius: 4px; background: var(--tile); color: var(--tile-ink); box-shadow: inset 0 0 0 1px rgb(20 20 20 / 0.12); display: grid; place-items: center; font: 600 10px var(--mono); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .chip { appearance: none; font: 500 12px var(--mono); padding: 3px 9px; border: 1px solid var(--rule); border-radius: 999px; background: var(--bg); color: var(--ink); }
  button.chip { cursor: pointer; }
  .chip.later { color: var(--muted); border-style: dashed; }
  .opts { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
  .opt { appearance: none; text-align: left; border: 1px solid var(--rule); border-radius: 8px; padding: 12px; background: var(--bg); cursor: pointer; display: flex; flex-direction: column; gap: 4px; }
  .opt:hover { border-color: color-mix(in srgb, var(--accent) 40%, var(--rule)); }
  .opt.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .opt b { font-size: 14px; } .opt span { font-size: 12.5px; color: var(--muted); }
  .opt-fig { height: 30px; margin-bottom: 4px; }
  .opt-fig svg { height: 30px; width: auto; display: block; }
  .params { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 8px; }
  .pm { border: 1px solid var(--rule); border-radius: 6px; padding: 7px 10px; display: flex; flex-direction: column; gap: 1px; background: var(--bg); }
  .pm .k { font-size: 12px; color: var(--muted); display: flex; gap: 6px; align-items: center; }
  .pm .v { font: 500 13px var(--mono); }
  .pm.is-later { border-style: dashed; } .pm.is-later .v { color: var(--muted); }
  .badge { display: inline-block; font: 500 11px/16px var(--mono); padding: 1px 6px; border-radius: 4px; border: 1px solid var(--rule); color: var(--muted); white-space: nowrap; }
  .badge.ok { color: var(--up); border-color: color-mix(in srgb, var(--up) 45%, var(--rule)); }
  .badge.warn { color: var(--warn); border-color: color-mix(in srgb, var(--warn) 45%, var(--rule)); }
  .badge.later { border-style: dashed; }
  .shape { display: flex; flex-wrap: wrap; align-items: baseline; gap: 8px; padding: 10px 12px; border-radius: 6px; background: var(--accent-soft); }
  .shape b { font: 600 18px var(--mono); color: var(--accent); }
  .check { display: flex; gap: 8px; align-items: flex-start; padding: 10px 12px; border-radius: 6px; border: 1px solid var(--rule); font-size: 13px; }
  .check.ok { border-color: color-mix(in srgb, var(--up) 40%, var(--rule)); }
  .check.warn { border-color: color-mix(in srgb, var(--warn) 45%, var(--rule)); }
  .check .dot { flex: none; width: 8px; height: 8px; border-radius: 999px; margin-top: 6px; background: var(--up); }
  .check.warn .dot { background: var(--warn); }
  .models { display: flex; flex-direction: column; gap: 6px; }
  .model { appearance: none; display: grid; grid-template-columns: 18px minmax(0, 1fr) auto; gap: 10px; align-items: center; text-align: left; padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); cursor: pointer; }
  .model.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .model.off { cursor: default; } .model.off .mn { color: var(--muted); }
  .radio { width: 16px; height: 16px; border-radius: 999px; border: 1.5px solid var(--rule); display: grid; place-items: center; }
  .model.on .radio { border-color: var(--accent); } .model.on .radio::after { content: ""; width: 8px; height: 8px; border-radius: 999px; background: var(--accent); }
  .mn, .mm { display: block; }
  .mn { font-weight: 500; font-size: 13.5px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .mm { font: 12px var(--mono); color: var(--muted); }
  .drop { border: 1.5px dashed var(--rule); border-radius: 8px; padding: 14px; display: flex; gap: 12px; align-items: center; justify-content: space-between; flex-wrap: wrap; }
  .tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 8px; }
  .tm { padding: 10px 12px; border: 1px solid var(--rule); border-radius: 8px; background: var(--bg); min-width: 0; }
  .tm .k { font-size: 12px; color: var(--muted); }
  .tm .v { font: 600 21px/1.3 var(--mono); font-variant-numeric: tabular-nums; }
  .tm .s { font: 11.5px var(--mono); color: var(--muted); }
  .run-h { display: flex; justify-content: space-between; align-items: center; gap: 10px; flex-wrap: wrap; }
  .tblwrap { overflow-x: auto; }
  .tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { font-weight: 500; color: var(--muted); text-align: left; padding: 8px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; }
  .tbl td { padding: 8px 12px; border-bottom: 1px solid var(--rule); white-space: nowrap; font-variant-numeric: tabular-nums; }
  .tbl tr:last-child td { border-bottom: 0; }
  .num { text-align: right; font-family: var(--mono); }
  .tbl th.num { text-align: right; }

  /* Charts */
  .chart svg { display: block; width: 100%; height: auto; }
  .ax { fill: var(--muted); font: 11px var(--mono); }
  .gl { stroke: var(--rule); stroke-width: 1; }
  .cu { fill: var(--candle-up); stroke: var(--candle-up); }
  .cd { fill: var(--candle-down); stroke: var(--candle-down); }
  .br { stroke: var(--bg); stroke-width: 0.5; }
  .kgu { stroke: var(--candle-up); fill: none; } .kgd { stroke: var(--candle-down); fill: none; }
  .hold { fill: var(--candle-up); opacity: 0.08; } .hold.s { fill: var(--candle-down); }
  .mk-in { fill: var(--candle-up); } .mk-ins { fill: var(--candle-down); } .mk-out { fill: var(--muted); }
  .win { fill: var(--accent); opacity: 0.1; stroke: var(--accent); stroke-dasharray: 4 3; }
  .wl { fill: var(--accent); font: 500 11px var(--mono); }
  .pb { fill: var(--muted); opacity: 0.55; } .pb-l { fill: var(--candle-up); } .pb-s { fill: var(--candle-down); } .pb-n { fill: var(--muted); opacity: 0.3; }
  .tl { stroke: var(--accent); stroke-width: 1.25; stroke-dasharray: 4 3; }
  .eq { fill: none; stroke: var(--accent); stroke-width: 2; } .eqa { fill: var(--accent); opacity: 0.1; } .eqd { fill: var(--accent); }
  .bh { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .lgd-s { fill: var(--accent); font: 500 12px var(--mono); } .lgd-b { fill: var(--muted); font: 500 12px var(--mono); }
  .mxc { fill: var(--accent); } .mxo { fill: var(--accent-soft); stroke: var(--accent); }
  .arr { stroke: var(--muted); stroke-width: 1.5; } .arrh { fill: var(--muted); }
  .sk { fill: none; stroke-width: 1.5; } .sk.u { stroke: var(--candle-up); } .sk.d { stroke: var(--candle-down); }
  .cap { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; font: 12px var(--mono); color: var(--muted); }
  .mx-row { display: grid; grid-template-columns: minmax(0, 260px) minmax(0, 1fr); gap: 16px; align-items: center; }
  .mx { width: 100%; height: auto; display: block; }

  /* B: pipeline */
  .pl-nodes { display: flex; align-items: stretch; overflow-x: auto; padding: 2px 2px 10px; }
  .node { appearance: none; flex: 1 0 168px; border: 1px solid var(--rule); border-radius: 10px; background: var(--bg); padding: 12px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .node.on { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .node.layer { border-top: 3px solid var(--accent-soft); }
  .node b { font-size: 14px; } .node .nv { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .node .no { font: 11.5px var(--mono); color: var(--accent); }
  .wire { flex: 0 0 26px; align-self: center; height: 2px; background: var(--rule); position: relative; }
  .wire::after { content: ""; position: absolute; right: -1px; top: -4px; border: 5px solid transparent; border-left: 6px solid var(--rule); border-right: 0; }
  .pl-body { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr); gap: 16px; margin-top: 14px; align-items: start; }
  .pane { padding: 20px; }
  .pane h3 { font-size: 16px; margin-bottom: 4px; }

  /* Notes */

  @media (max-width: 980px) {
    .lc, .pl-body, .two-ch { grid-template-columns: minmax(0, 1fr); }
    .lc-main { position: static; }
  }
  @media (max-width: 640px) {
    .anav, .hide-sm { display: none; }
    .ahdr { gap: 10px; padding: 0 12px; }
    .logo { width: 130px; height: 24px; }
    .abody { padding: 20px 14px 28px; }
    .sn-text { font-size: 20px; }
    .wz-prog .sv { display: none; }
    .wz-prog .l { font-size: 11px; }
    .wz-card, .sn, .pane { padding: 18px; }
    .mx-row { grid-template-columns: minmax(0, 1fr); }
    .cell { grid-template-columns: 30px minmax(0, 1fr); }
    .pop .muted { display: none; }
  }
  /* Header: production's (frontend/src/components/Header.tsx). A 1152 px row inside 24 px, nav 18 px apart.
     Signed in, Sign in becomes the account menu and Try Backtest becomes New backtest. */
  .ahdr { display: block; height: auto; padding-block: 0; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); position: relative; z-index: 30; }
  .ahdr-in { max-width: 1152px; margin: 0 auto; height: 56px; display: flex; align-items: center; gap: 20px; }
  .anav button { appearance: none; border: 0; background: none; padding: 0; font: 14px var(--sans); color: var(--muted); cursor: pointer; }
  .anav button:hover, .anav button.on { color: var(--ink); }
  .anav button.on { font-weight: 500; }
  .ahdr .r { position: relative; }
  .av-btn { appearance: none; border: 0; padding: 0; cursor: pointer; border-radius: 999px; line-height: 0; }
  .av-btn:hover .avatar, .av-btn[aria-expanded="true"] .avatar { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 35%, transparent); }
  .amenu { position: absolute; right: 0; top: calc(100% + 10px); width: 240px; z-index: 35; background: var(--bg); border: 1px solid var(--rule); border-radius: 8px; box-shadow: 0 10px 28px var(--shadow); padding: 4px; display: flex; flex-direction: column; }
  .amenu .who { padding: 8px 10px 10px; display: flex; flex-direction: column; border-bottom: 1px solid var(--rule); margin-bottom: 4px; }
  .amenu .who b { font-weight: 500; } .amenu .who span { font-size: 12.5px; color: var(--muted); }
  .amenu button { appearance: none; text-align: left; padding: 8px 10px; border: 0; background: none; border-radius: 6px; font: 14px var(--sans); color: var(--ink); cursor: pointer; }
  .amenu button:hover { background: var(--surface); }
  .amenu button { display: flex; align-items: center; gap: 10px; }
  .amenu button .i { flex: none; color: var(--muted); }
  .amenu button.out, .amenu button.out .i { color: var(--down); }
  .amenu button.out:hover { background: color-mix(in srgb, var(--down) 10%, transparent); }
  .amenu hr { border: 0; border-top: 1px solid var(--rule); margin: 4px 0; }
  .abody { max-width: 1200px; width: 100%; padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }
  .afoot .cred { display: flex; flex-wrap: wrap; gap: 4px 20px; margin-left: auto; }
  .afoot a { color: inherit; text-decoration: none; }
  .afoot a:hover { color: var(--ink); }
  .afoot .cred a { text-decoration: underline; }
  .afoot u, .afoot .cred a { text-underline-offset: 2px; }
  .afoot div { padding-left: max(24px, env(safe-area-inset-left, 0px)); padding-right: max(24px, env(safe-area-inset-right, 0px)); }

  /* The page is the app: no review bar, no frame around it */
  body { padding-left: 0; padding-right: 0; padding-block: 0; }
  .frame { border: 0; border-radius: 0; box-shadow: none; overflow: visible; min-height: 100vh; display: flex; flex-direction: column; }
  .frame > main { flex: 1; }
  .nb-i { display: none; }

  /* Shared bits */
  .badge.bad { color: var(--down); border-color: color-mix(in srgb, var(--down) 45%, var(--rule)); }
  .badge.run { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 45%, var(--rule)); }
  .prog { display: block; height: 6px; border-radius: 3px; background: var(--surface2); overflow: hidden; min-width: 60px; }
  .prog i { display: block; height: 100%; border-radius: 3px; background: var(--accent); }
  .back { appearance: none; border: 0; background: none; padding: 0; margin-bottom: 14px; color: var(--muted); font: 13px var(--sans); cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
  .back:hover { color: var(--ink); }
  /* Star: a 28 px target, grows a little on hover. A set star fades on hover, so it reads as "click to remove". */
  .star { appearance: none; flex: none; width: 28px; height: 28px; margin: -4px -2px; display: inline-grid; place-items: center; border: 0; border-radius: 6px; background: none; padding: 0; cursor: pointer; color: color-mix(in srgb, var(--muted) 55%, var(--bg)); font-size: 19px; line-height: 1; }
  .star:hover { background: var(--surface); color: var(--warn); transform: scale(1.12); }
  .star.on { color: var(--warn); }
  .star.on:hover { color: color-mix(in srgb, var(--warn) 45%, var(--bg)); }
  .rid { font: 500 13px var(--mono); }
  .ck { appearance: none; width: 16px; height: 16px; border-radius: 4px; border: 1.5px solid var(--rule); background: var(--bg); padding: 0; cursor: pointer; display: grid; place-items: center; color: var(--on-accent); font-size: 11px; line-height: 1; }
  .ck.on { background: var(--accent); border-color: var(--accent); }
  .ck.on::after { content: "✓"; }
  .ichips { display: inline-flex; gap: 4px; flex-wrap: nowrap; }
  .ichips .chip { padding: 1px 7px; font-size: 11.5px; }
  .tbl td.wrapok { white-space: normal; min-width: 180px; }
  .tbl tr.rl { cursor: pointer; }
  .tbl tr.rl:hover td { background: var(--surface); }

function niceTicks(lo, hi, n) { const raw = (hi - lo) / n; const p = Math.pow(10, Math.floor(Math.log10(raw))); const m = raw / p; const st = (m < 1.5 ? 1 : m < 3 ? 2 : m < 7 ? 5 : 10) * p; const out = []; for (let v = Math.ceil(lo / st) * st; v <= hi + 1e-9; v += st) out.push(+v.toFixed(6)); return out; }

// Example equity of a finished run: strategy (s) and buy & hold (b), 120 steps over 2021 to 2024
function eqRun(r) {
  if (r.st !== 'done') return null;

  const rnd = mulberry(r.id * 7919 + 13), n = 120, v = Math.min(1.4, 0.6 + Math.abs(r.dd) / 25);
  const mk = (tg, vol) => { const w = [0]; for (let i = 1; i <= n; i++) w.push(w[i - 1] + gauss(rnd) * vol); return w.map((x, i) => 1 + tg * i / n + x - w[n] * i / n); };

}
function equity(e, h = 220) {
  const w = 800, pl = 8, pr = 52, pt = 26, pb = 24, iw = w - pl - pr, ih = h - pt - pb;
  const all = [...e.s, ...e.b]; let lo = Math.min(...all), hi = Math.max(...all); const pd = (hi - lo) * 0.08; lo -= pd; hi += pd;
  const x = i => pl + i / e.n * iw, y = v => pt + (hi - v) / (hi - lo) * ih; let g = '';
  niceTicks(lo - 1, hi - 1, 4).forEach(t => { const yy = y(1 + t); g += `<line class="gl" x1="${pl}" x2="${pl + iw}" y1="${yy}" y2="${yy}"/><text class="ax" x="${w - pr + 6}" y="${yy + 4}">${sgn(Math.round(t * 100))}%</text>`; });
  ['2021', '2022', '2023', '2024'].forEach((l, k) => { g += `<text class="ax" x="${x(k * 30) + 2}" y="${h - 6}">${l}</text>`; });
  const line = a => a.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)} ${y(v).toFixed(1)}`).join('');
  g += `<path class="eqa" d="${line(e.s)}L${x(e.n)} ${y(1)}L${x(0)} ${y(1)}Z"/><path class="bh" d="${line(e.b)}"/><path class="eq" d="${line(e.s)}"/><circle class="eqd" cx="${x(e.n)}" cy="${y(e.s[e.n])}" r="3.5"/>`;
  g += `<text class="lgd-s" x="${pl}" y="14">— Strategy ${pct((e.s[e.n] - 1) * 100)}</text><text class="lgd-b" x="${pl + 170}" y="14">- - Buy &amp; hold ${pct((e.b[e.n] - 1) * 100)}</text>`;

}

}

  return `<div class="card tblwrap"><table class="tbl"><tr><th>Instrument</th><th class="num">Return</th><th class="num">Buy &amp; hold</th><th class="num">Sharpe</th><th class="num">Max drawdown</th><th class="num">Trades</th></tr>${rows}</table></div>`;

function newCfg() {
  const s = S.newSrc, dv = { inst: ['AAPL'], rep: 'renko', model: null, dir: S.setv.dir, t: 0.05, sl: `${S.setv.sl} %` };
  if (!s) return { cfg: dv, set: [true, true, false, true, true], label: 'Starts with your backtest defaults' };
  if (s.k === 'model') return { cfg: { inst: ['AAPL'], rep: 'windows', model: s.name, dir: S.setv.dir, t: 0.05, sl: `${S.setv.sl} %` }, set: [true, true, true, true, true], label: `With ${s.name}` };
  if (s.k === 'run') { const r = runById(s.id); return { cfg: r, set: [true, true, true, true, true], label: `A copy of backtest #${r.id}` }; }
  const t = TEMPLATES[s.i]; return { cfg: t.cfg, set: [true, true, !!t.cfg.model, true, true], label: `Starting point · ${t.n}` };
}
function pageNew() {
  const { cfg, set, label } = newCfg();

}

// Overlays: a function per modal, S.modal names the open one
const MODALS = {};
const PAGES = { run: pageRun, new: pageNew, runs: pageRuns, models: pageModels };

function render() {
  const A = S.anim = { page: S.page !== S._pg, modal: !!S.modal && S.modal !== S._md, menu: S.menu && !S._mn, pop: !!S.pop && S.pop !== S._pp };
  S._pg = S.page; S._md = S.modal; S._mn = S.menu; S._pp = S.pop;
  const d = DIRS[S.v];
  const own = S.page === 'dash' || (d.owns || []).includes(S.page);

    ${S.pop === 'bench' ? `<div class="fp st-bp ${S.anim && S.anim.pop ? 'in' : ''}" data-pop data-act="stay" role="listbox" aria-label="Benchmark">${BENCH.map(([k, n, d]) => `<button type="button" class="fp-o st-bo ${S.setv.bench === k ? 'on' : ''}" role="option" aria-selected="${S.setv.bench === k}" data-act="benchPick" data-val="${k}"><span class="st-bk">${k === 'bh' ? 'B&amp;H' : k}</span><span class="st-bn"><span>${n}</span><span class="hint">${d}</span></span><svg class="i fp-ck" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l4 4 10-10"/></svg></button>`).join('')}</div>` : ''}</div>`;
  const defaults = `<section class="card dd-card st-card">${stHead('sliders', 'Backtest defaults', '<span class="hint">New backtests start here</span>')}
    ${stRow('Timeframe', seg(['5m', '30m', '1h', '1d'], S.setv.tf, 'setv', 'tf'))}${stRow('Test period', `<div class="st-two">${stInp('2021-01-04', 'From')}<span class="muted">to</span>${stInp('2024-12-31', 'To')}</div>`)}
    <div class="st-r st-rtop"><span class="st-l">Direction</span><div class="st-c st-dirs">${dirCard('long', 'Long only', 'Buy on a signal, sell on the exit', UP)}${dirCard('both', 'Long and short', 'Also sell short when it points down', UP + DN)}</div></div>
    ${stRow('Threshold', slider('the', 0, 0.5, 0.01, v => (+v).toFixed(2), 'Threshold'), 'Signal strength to trade')}${stRow('Stop loss', slider('sl', 1, 20, 1, v => `${v} %`, 'Stop loss'), 'Exit when a trade loses this much')}
    ${stRow('Fees', unit('0.1', '% per side', 'Fees'))}${stRow('Slippage', unit('0.02', '%', 'Slippage'))}${stRow('Benchmark', benchCtl, 'What each backtest is measured against')}<div class="st-f"><button type="button" class="btn sm pri">Save defaults</button></div></section>`;
  // Appearance: theme, time zone, date and time formats, reduce motion
  const tz = (() => { try { return Intl.DateTimeFormat().resolvedOptions().timeZone; } catch (e) { return 'Europe/Bratislava'; } })();
  const sw = (k, label) => `<button type="button" class="st-sw ${S.setv[k] ? 'on' : ''}" role="switch" aria-checked="${!!S.setv[k]}" aria-label="${label}" data-act="svToggle" data-val="${k}"><i></i></button>`;
  const look = `<section class="card dd-card st-card">${stHead('look', 'Appearance')}${stRow('Theme', seg([['light', 'Light'], ['dark', 'Dark']], isDark() ? 'dark' : 'light', 'theme3'))}
    ${stRow('Time zone', seg([['ny', 'New York'], ['local', tz.split('/').pop().replace(/_/g, ' ')]], S.setv.tz, 'setv', 'tz'), S.setv.tz === 'ny' ? 'Exchange time' : 'Your time zone')}
    ${stRow('Date format', seg([['dmy', '12 Oct 2024'], ['iso', '2024-10-12'], ['dot', '12.10.2024']], S.setv.df, 'setv', 'df'))}${stRow('Time format', seg([['24', '16:05'], ['12', '4:05 PM']], S.setv.tf2, 'setv', 'tf2'))}
    ${stRow('Reduce motion', sw('calm', 'Reduce motion'), 'Turns off the small animations')}</section>`;
  const data = `<section class="card dd-card st-card">${stHead('data', 'Data and storage')}${stRow('Market data', '<span>Alpaca, SIP feed</span>', 'Delayed 15 min')}${stRow('Backtests', `<span class="mono">${nb}</span>`, 'Kept until you delete them')}
    ${stRow('Models', `<div class="st-meter"><span class="mono">${mb} MB of ${USAGE.capMB} MB</span><span class="meter"><i style="width:${mb / USAGE.capMB * 100}%"></i></span></div>`, `${ups} uploaded`)}</section>`;
  // API and MCP: keys for scripts and the API, and the MCP server for Claude or ChatGPT (not built yet)
  const soon = '<span class="cs-tag st-soon"><span class="cs-dot"></span>Coming soon</span>';
  const apps = `<section class="card dd-card st-card st-mcp">${stHead('code', 'API keys', soon)}<p class="hint st-lead">Run backtests and read results from your own scripts. A key acts as you, so you keep it secret.</p>
    ${stRow('Public API', '<a class="link" href="https://app.candlestack.tech/api/v1/docs" target="_blank" rel="noopener">API docs</a>', 'Instruments and candles, no key needed')}</section>
    <section class="card dd-card st-card st-mcp">${stHead('plug', 'MCP server', soon)}<p class="hint st-lead">Use CandleStack from Claude or ChatGPT. Ask about your backtests, start new ones and compare them in a chat. You sign in with your CandleStack account.</p>
    ${stRow('Server URL', '<span class="st-id"><code>https://app.candlestack.tech/mcp</code></span>')}</section>`;
  const danger = `<section class="card dd-card st-card st-danger">${stHead('warn', 'Account')}<div class="st-dz"><div><b>Sign out everywhere</b><span class="hint">Ends every session on every device.</span></div><button type="button" class="btn sm">Sign out everywhere</button></div><div class="st-dz"><div><b>Delete account</b><span class="hint">Deletes your backtests and uploaded models. This cannot be undone.</span></div><button type="button" class="btn sm danger" data-act="delAcct">Delete account</button></div></section>`;
  const SECT = { profile: ['Profile', profile], signin: ['Sign-in', signin], defaults: ['Backtest defaults', defaults], look: ['Appearance', look], data: ['Data and storage', data], apps: ['API and MCP', apps], acct: ['Account', danger] };
  if (!SECT[S.set]) S.set = 'profile';
  const tabs = `<nav class="st-tabs" aria-label="Settings sections">${Object.entries(SECT).map(([k, [l]]) => `<button type="button" class="${S.set === k ? 'on' : ''}" data-act="setTab" data-val="${k}" ${S.set === k ? 'aria-current="page"' : ''}>${l}</button>`).join('')}</nav>`;
  const tabIn = S.set !== S._st; S._st = S.set;
  return `<div class="ttl"><div><h1>Settings</h1><p>Your account and how new backtests start</p></div></div>${tabs}<div class="st-one ${tabIn ? 'in' : ''}">${SECT[S.set][1]}</div>`;
}
function ddSide() {
  const on = S.page;
  const items = [['dash', 'Dashboard', ''], ['runs', 'Backtests', runs().length], ['models', 'Models', models().length], ['settings', 'Settings', '']];
  const nav = items.map(([k, l, n]) => `<button type="button" class="dd-nav ${on === k ? 'on' : ''}" ${k === 'settings' ? 'data-act="setTab" data-val="profile"' : `data-act="dNav" data-val="${k}"`} ${on === k ? 'aria-current="page"' : ''}><svg class="i" viewBox="0 0 24 24" aria-hidden="true">${DD_IC[k]}</svg><span>${l}</span>${n !== '' ? `<span class="dd-n">${n}</span>` : ''}</button>`).join('');
  const mb = S.empty ? 0 : USAGE.modelsMB;
  return `<nav class="card dd-side" aria-label="Workspace">${nav}<div class="dd-sfoot"><span class="eyebrow">Storage</span><span class="meter"><i style="width:${mb / USAGE.capMB * 100}%"></i></span><span class="dd-s">${mb} MB of ${USAGE.capMB} MB models</span><span class="hint">${DATA_NOTE}</span></div></nav>`;
}
ACT.bestBy = (b, v) => { S.d.best = v; return true; };
ACT.dNav = (b, v) => {
  if (S.page !== v) go(v);
  return true;
};
DFN.D = () => {
  const main = S.page === 'runs' ? ddRuns() : S.page === 'models' ? ddModels() : S.page === 'settings' ? ddSettings() : ddDash();
  return `<div class="dd-ws">${ddSide()}<div class="dd-main ${S.anim && S.anim.page ? 'in' : ''}">${main}</div></div>`;
};

// ---------- quick actions, model upload, compare ----------
const QA_IC = {
  plus: '<path d="M12 5v14M5 12h14"/>',
  up: '<path d="M12 15V4M7 9l5-5 5 5"/><path d="M4 15v4a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-4"/>',
  cmp: '<path d="M4 7h13l-3-3M20 17H7l3 3"/>',
  ok: '<path d="M5 12l4 4 10-10"/>',
  x: '<path d="M6 6l12 12M18 6L6 18"/>',
};
const qi = (k, cls = 'i') => `<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${QA_IC[k]}</svg>`;
const fwMini = fw => FW_IC[fw] ? `<svg class="fw-mini" style="--fw:${FW_IC[fw][0]}" viewBox="0 0 24 24" role="img" aria-label="${fw}"><path d="${FW_IC[fw][1]}"/></svg>` : '';
const FWS = ['Keras', 'TensorFlow', 'PyTorch', 'ONNX', 'scikit-learn'];

// The strip under the greeting
function ddActions() {
  return `<div class="qa">
    <button type="button" class="qa-c pri" data-act="go" data-val="new"><span class="qa-i">${qi('plus')}</span><span class="qa-t"><b>New backtest</b><span class="h">Pick the data, a model and a rule</span></span></button>
    <button type="button" class="qa-c" data-act="upOpen"><span class="qa-i">${qi('up')}</span><span class="qa-t"><b>Upload model</b><span class="qa-fws">${FWS.map(fwMini).join('')}</span></span></button>
    <button type="button" class="qa-c" data-act="cmpOpen"><span class="qa-i">${qi('cmp')}</span><span class="qa-t"><b>Compare backtests</b><span class="h">Two side by side on one chart</span></span></button>
  </div>`;
}

// ---------- upload: a file, then two checks ----------
// Example files in the chooser. Two pass. The last has the layers but no trained weights.
const UP_FILES = [
  { name: 'lstm-signals.keras', fw: 'Keras', mb: 12.4, shape: [25, 101, 1], params: '1.24 M', when: 'Today 15:02', ok: true },
  { name: 'tcn-signals.pt', fw: 'PyTorch', mb: 8.1, shape: null, params: '0.86 M', when: 'Yesterday 21:40', ok: true },
  { name: 'lstm-draft.keras', fw: 'Keras', mb: 0.3, shape: [25, 23, 1], params: '0.31 M', when: '12 Oct', ok: false },
];
// What "a real model" means per format: it opens as that format and runs no code of its own
const UP_SAFE = { Keras: 'Opens as a Keras model, no custom code inside', PyTorch: 'Opens as PyTorch weights, no pickled code', ONNX: 'Opens as an ONNX graph', TensorFlow: 'Opens as a TensorFlow SavedModel, no custom ops', 'scikit-learn': 'Opens as a scikit-learn estimator from a trusted format' };
S.up = null;
S.modal = null;
const upFile = () => UP_FILES[S.up.f];
const shapeText = s => `${s[0]} × ${s[1]} → ${s[2]}`;

function modalShell(title, body, foot, wide) {
  return `<div class="mbg ${S.anim && S.anim.modal ? 'in' : ''}" data-act="closeModal"><div class="mdl ${wide ? 'wide' : ''}" role="dialog" aria-modal="true" aria-label="${title}" data-act="stay">
    <div class="mdl-h"><h2>${title}</h2><button type="button" class="btn ghost icon" data-act="closeModal" aria-label="Close">${qi('x')}</button></div>
    <div class="mdl-b">${body}</div>${foot ? `<div class="mdl-f">${foot}</div>` : ''}</div></div>`;
}
const chk = (ok, t, s) => `<li class="ck-r ${ok ? 'ok' : 'bad'}"><span class="ck-i">${qi(ok ? 'ok' : 'x')}</span><span><b>${t}</b>${s ? `<span class="h">${s}</span>` : ''}</span></li>`;
function upBody() {
  const u = S.up;
  if (u.step === 0) {
    return `<button type="button" class="up-drop" data-act="upPick"><span class="qa-i">${qi('up')}</span><b>Drop a trained model here</b><span class="h">or click to choose a file. Up to 100 MB.</span><span class="qa-fws">${FWS.map(f => `<span class="fw-l">${fwMini(f)}${f}</span>`).join('')}</span></button>
      ${u.picker ? `<div class="up-pick"><span class="eyebrow">Downloads</span>${UP_FILES.map((f, i) => `<button type="button" class="up-pf" data-act="upFile" data-val="${i}">${fwIcon(f.fw)}<span><b>${f.name}</b><span class="h">${f.mb} MB · ${f.when}</span></span></button>`).join('')}</div>` : ''}`;
  }
  const f = upFile();
  const head = `<div class="up-file">${fwIcon(f.fw)}<span><b>${f.name}</b><span class="h">${f.fw} · ${f.mb} MB</span></span></div>`;
  const checks = `<ul class="cks">${chk(true, UP_SAFE[f.fw])}${f.ok ? chk(true, 'Trained weights inside', `${f.params} parameters`) : chk(false, 'No trained weights in the file', 'It holds the layers only. Save the model after training and upload that file.')}</ul>`;
  const done = f.ok ? `<div class="up-ok"><b>${f.name} is ready</b><span class="h">${f.fw} · ${f.params} parameters${f.shape ? ` · in ${shapeText(f.shape)}` : ''}</span></div>` : '';
  return `${head}${checks}${done}`;
}
function upFoot() {
  if (S.up.step === 0) return '';
  if (!upFile().ok) return '<button type="button" class="btn" data-act="closeModal">Cancel</button><button type="button" class="btn pri" data-act="upAgain">Choose another file</button>';
  return '<button type="button" class="btn" data-act="upDone" data-val="models">Done</button><button type="button" class="btn pri" data-act="upDone" data-val="bt">Backtest with it</button>';
}
MODALS.upload = () => modalShell('Upload model', upBody(), upFoot());
ACT.upOpen = () => { S.modal = 'upload'; S.up = { f: 0, step: 0, picker: false }; return true; };
ACT.upPick = () => { S.up.picker = !S.up.picker; return true; };
ACT.upFile = (b, v) => { S.up = { f: +v, step: 1, picker: false }; return true; };
ACT.upAgain = () => { S.up = { f: 0, step: 0, picker: true }; return true; };
ACT.upDone = (b, v) => {
  const f = upFile();
  if (!MODELS.find(m => m.name === f.name)) {
    MODELS.push({ id: `up${S.up.f}`, name: f.name, fw: f.fw, src: 'up', fresh: true, reads: 'windows', shape: f.shape ? shapeText(f.shape) : null, runs: 0, size: `${f.mb} MB`, added: 'Today' });
    USAGE.modelsMB = +(USAGE.modelsMB + f.mb).toFixed(1);
  }
  S.modal = null;
  if (v === 'bt') S.modal = 'new'; else go('models');
  return true;
};
ACT.closeModal = () => { S.modal = null; return true; };

// ---------- compare: not built yet ----------
// The home page's Coming soon: a faint sketch of a runs table, fading out downwards, the tag over it
const CS_HEAD = [60, 50, 45, 55, 60];
const CS_ROWS = [[[70, 85, 60, 72, 70], 'up'], [[55, 75, 70, 58, 70], 'up'], [[65, 90, 50, 50, 70], 'down'], [[60, 70, 65, 40, 70], 'up']];
const csBar = (w, cls = '') => `<span class="cs-bar ${cls}" style="width:${w}%"></span>`;
function comingSoon() {
  const head = `<div class="cs-row">${CS_HEAD.map(w => csBar(w, 'f')).join('')}</div>`;
  const rows = CS_ROWS.map(([ws, tone]) => `<div class="cs-row">${ws.map((w, i) => csBar(w, i === 3 ? tone : '')).join('')}</div>`).join('');
  return `<div class="cs"><div class="cs-sk" aria-hidden="true">${head}${rows}</div><span class="cs-tag"><span class="cs-dot"></span>Coming soon</span></div>`;
}
MODALS.compare = () => modalShell('Compare backtests', `<p class="h">Change one layer, run again and see which combination holds up across market conditions.</p>${comingSoon()}`);
ACT.cmpOpen = () => { S.modal = 'compare'; return true; };
// A backtest's own page: a sketch of result tiles over a faint equity line
function runSoon() {
  const tiles = [[55, 70, 'up'], [45, 50, ''], [60, 55, 'down'], [50, 45, '']].map(([a, b, t]) => `<div class="cs-tile">${csBar(a, 'f')}${csBar(b, t)}</div>`).join('');
  const line = 'M0 70 L40 62 L80 66 L120 52 L160 56 L200 40 L240 46 L280 30 L320 36 L360 22 L400 26';
  const bh = 'M0 70 L50 64 L100 60 L150 58 L200 50 L250 48 L300 40 L350 38 L400 32';
  return `<div class="cs"><div class="cs-sk" aria-hidden="true"><div class="cs-tiles">${tiles}</div><svg class="cs-ch" viewBox="0 0 400 80" preserveAspectRatio="none"><path class="cs-bh" d="${bh}"/><path class="cs-eq" d="${line}"/></svg></div><span class="cs-tag"><span class="cs-dot"></span>Coming soon</span></div>`;
}
// The builder: a sketch of the five blocks in a row, wired left to right
function newSoon() {
  const nodes = [[60, 75], [70, 55], [65, 80], [55, 60], [60, 50]].map(([a, b], i) => `${i ? '<span class="cs-wire"></span>' : ''}<div class="cs-node">${csBar(a, 'f')}${csBar(b, i === 4 ? 'up' : '')}</div>`).join('');
  return `<div class="cs"><div class="cs-sk" aria-hidden="true"><div class="cs-pipe">${nodes}</div><div class="cs-pane">${csBar(35, 'f')}${csBar(80)}${csBar(65)}${csBar(72)}</div></div><span class="cs-tag"><span class="cs-dot"></span>Coming soon</span></div>`;
}
// ---------- models: rename, delete ----------
S.md = null;
const mdById = id => MODELS.find(m => m.id === id);
const splitExt = name => { const i = name.lastIndexOf('.'); return i > 0 ? [name.slice(0, i), name.slice(i)] : [name, '']; };
MODALS.rename = () => {
  const m = mdById(S.md), [stem, ext] = splitExt(m.name);
  return modalShell('Rename model', `<label class="md-f"><span class="hint">Name</span><span class="md-in"><input class="inp" id="md-name" value="${esc(stem)}" aria-label="Model name" maxlength="60"><span class="md-ext">${ext}</span></span></label><p class="h">The extension stays ${ext}. Backtests that used this model show the new name.</p>`,
    '<button type="button" class="btn" data-act="closeModal">Cancel</button><button type="button" class="btn pri" data-act="mdRenameOk">Save</button>');
};
MODALS.del = () => {
  const m = mdById(S.md), n = runs().filter(r => r.model === m.name).length;
  return modalShell(`Delete ${m.name}?`, `<p>The file goes from your models and frees ${m.size}.${n === 1 ? ' The backtest that used it stays, with its results.' : n ? ` The ${n} backtests that used it stay, with their results.` : ''} This cannot be undone.</p>`,
    '<button type="button" class="btn" data-act="closeModal">Cancel</button><button type="button" class="btn danger pri" data-act="mdDeleteOk">Delete</button>');
};
ACT.mdRename = (b, v) => { S.md = v; S.modal = 'rename'; return true; };
ACT.mdDelete = (b, v) => { S.md = v; S.modal = 'del'; return true; };
ACT.mdRenameOk = () => {
  const m = mdById(S.md), [, ext] = splitExt(m.name), stem = ((document.getElementById('md-name') || {}).value || '').trim();
  if (stem) { const name = stem + ext; RUNS.forEach(r => { if (r.model === m.name) r.model = name; }); m.name = name; }
  S.modal = null; return true;
};
ACT.mdDeleteOk = () => { const i = MODELS.findIndex(m => m.id === S.md); if (i >= 0) { USAGE.modelsMB = +(USAGE.modelsMB - parseFloat(MODELS[i].size)).toFixed(1); MODELS.splice(i, 1); } S.modal = null; return true; };
MODALS.delAcct = () => modalShell('Delete account?', `<p>This deletes ${runs().length} backtests, ${models().filter(m => m.src === 'up').length} uploaded models and your account. This cannot be undone.</p>`,
  '<button type="button" class="btn" data-act="closeModal">Cancel</button><button type="button" class="btn danger pri" data-act="closeModal">Delete account</button>');
MODALS.new = () => modalShell('New backtest', `<p class="h">Pick the data, a representation, a model and a rule, then run it against buy and hold.</p>${newSoon()}`);
MODALS.run = () => { const r = runById(S.run); return modalShell(`Backtest #${r.id}`, `<p class="h">${instList(r.inst)} · ${REP[r.rep]} · ${r.model} · ${when(r)}</p>${runSoon()}`); };

render();

</script>
</body>
