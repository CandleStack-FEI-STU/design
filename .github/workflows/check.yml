name: Check

# `edited` too: editing the title or description checks the new text.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read

jobs:
  # No AI attribution in commits or the pull request. Nothing else to build here.
  no-ai-signs:
    uses: CandleStack-FEI-STU/.github/.github/workflows/no-ai-signs.yml@main
